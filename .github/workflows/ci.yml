name: OscilloLab CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  analyze_and_test:
    name: Analisis estatico y pruebas unitarias
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.0"
          channel: "stable"

      # El repositorio contiene solo lib/, test/ y pubspec.yaml (codigo
      # de la app); las carpetas nativas android/ e ios/ se generan aqui
      # antes de compilar, sin tocar ningun archivo Dart existente.
      - name: Generar carpetas nativas (android/ios)
        run: flutter create --platforms=android,ios --org com.oscillolab.app --project-name oscillolab .

      - name: Obtener dependencias
        run: flutter pub get

      - name: Analizar codigo (flutter analyze)
        run: flutter analyze --no-fatal-infos

      - name: Verificar formato (dart format)
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Ejecutar pruebas unitarias y de widgets
        run: flutter test --coverage

      - name: Subir reporte de cobertura
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/lcov.info

  build_apk:
    name: Construir APK de release
    needs: analyze_and_test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Java (requerido por Gradle/Android)
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.0"
          channel: "stable"

      - name: Generar carpetas nativas (android/ios)
        run: flutter create --platforms=android,ios --org com.oscillolab.app --project-name oscillolab .

      - name: Obtener dependencias
        run: flutter pub get

      - name: Generar iconos de la app
        run: dart run flutter_launcher_icons

      - name: Construir APK de release
        run: flutter build apk --release

      - name: Publicar APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: oscillolab-release.apk
          path: build/app/outputs/flutter-apk/app-release.apk
